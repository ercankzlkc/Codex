name: Oyunu derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oyun-yayini
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/Codex/
      - name: Yayın dalını aç
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publication
      - name: Derlemeyi gh-pages dalına kaydet
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=.git dist/ publication/
          touch publication/.nojekyll
          cd publication
          git config user.name ercankzlkc
          git config user.email ercankzlkc@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Oyun derlemesini yayınla" -m "Kaynak: $SOURCE_SHA"
            git push origin HEAD:gh-pages
          fi
